<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Case Opening - Entrar</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="shortcut icon" href="./favicon.ico?v=2" type="image/x-icon" />
    <script type="module" src="js/pages/login.js"></script>
  </head>
  <body class="is_centered">
    <main class="auth_card">
      <h1>Entrar</h1>

      <form id="login_form" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>

        <p id="form_message" class="form_message" role="alert" hidden></p>

        <button type="submit" id="submit_btn" class="btn_primary">
          Entrar
        </button>
      </form>

      <p class="auth_footer">
        Não tem conta? <a href="signup.html">Cadastre-se</a>
      </p>
    </main>
  </body>
</html>
