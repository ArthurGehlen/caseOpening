<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Case Opening - Dashboard</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="../css/dashboard.css" />
    <link rel="shortcut icon" href="../favicon.ico?v=2" type="image/x-icon" />
    <script type="module" src="../js/pages/dashboard.js"></script>
  </head>
  <body>
    <main class="container dash">
      <p id="message" class="form_message is_error" role="alert" hidden></p>

      <header class="hero">
        <p class="eyebrow">Saldo Total</p>
        <p id="net_worth" class="hero_value">$ 0,00</p>

        <div class="split" aria-hidden="true">
          <span id="split_balance" class="split_part is_balance"></span>
          <span id="split_inventory" class="split_part is_inventory"></span>
        </div>

        <dl class="legend">
          <div class="legend_item is_balance">
            <dt>Saldo</dt>
            <dd id="balance">$ 0,00</dd>
          </div>
          <div class="legend_item is_inventory">
            <dt>Inventário</dt>
            <dd id="inventory_value">$ 0,00</dd>
          </div>
        </dl>
      </header>

      <dl class="stats">
        <div class="stat">
          <dt>Caixas abertas</dt>
          <dd id="stat_openings">0</dd>
        </div>
        <div class="stat">
          <dt>Total gasto</dt>
          <dd id="stat_spent">$ 0,00</dd>
        </div>
        <div class="stat">
          <dt>Média por caixa</dt>
          <dd id="stat_average">$ 0,00</dd>
        </div>
        <div class="stat">
          <dt>Itens guardados</dt>
          <dd id="stat_items">0</dd>
        </div>
      </dl>

      <div class="panels">
        <section class="panel">
          <h2 id="board_title" class="panel_title">Ranking</h2>
          <ol id="leaderboard" class="rows"></ol>
        </section>

        <section class="panel">
          <h2 id="recent_title" class="panel_title">Últimas aberturas</h2>
          <ul id="recent" class="rows"></ul>
        </section>
      </div>
    </main>
  </body>
</html>
