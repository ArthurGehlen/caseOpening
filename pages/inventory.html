<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Case Opening - Inventário</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/ui.css" />
    <link rel="stylesheet" href="../css/inventory.css" />
    <link rel="shortcut icon" href="../favicon.ico?v=2" type="image/x-icon" />
    <script type="module" src="../js/pages/inventory.js"></script>
  </head>
  <body>
    <main class="container inv">
      <p id="message" class="form_message is_error" role="alert" hidden></p>

      <header class="hero">
        <p class="eyebrow">Valor do inventário</p>
        <p id="total_value" class="hero_value">$ 0,00</p>
        <p id="total_count" class="hero_sub">0 itens</p>

        <div id="composition" class="composition" aria-hidden="true"></div>
      </header>

      <section class="toolbar">
        <div
          id="chips"
          class="chips"
          role="group"
        ></div>

        <label class="sort">
          <span>Ordenar</span>
          <select id="sort_by">
            <option value="recent">Mais recentes</option>
            <option value="price_desc">Maior valor</option>
            <option value="price_asc">Menor valor</option>
            <option value="rarity">Raridade</option>
          </select>
        </label>
      </section>

      <p id="status" class="status" hidden></p>

      <ul id="grid" class="grid"></ul>

      <div id="actionbar" class="actionbar" hidden>
        <label class="actionbar_all">
          <input type="checkbox" id="select_all" />
          <span>Selecionar visíveis</span>
        </label>
        <p id="selection_info" class="actionbar_info"></p>
        <button type="button" id="sell_selected_btn" class="actionbar_btn">
          Vender
        </button>
      </div>
    </main>
  </body>
</html>
